apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  annotations:
    higress.io/wasm-plugin-description: AI 高级指标监控插件，提供首字延迟 Histogram（P95）和基于阈值的模型排队监控
    higress.io/wasm-plugin-title: AI Metrics Advanced
  labels:
    higress.io/resource-definer: higress
    higress.io/wasm-plugin-built-in: 'false'
    higress.io/wasm-plugin-category: custom
    higress.io/wasm-plugin-name: ai-metrics-advanced
    higress.io/wasm-plugin-version: 1.0.0
  name: ai-metrics-advanced
  namespace: higress-system
spec:
  # 全局默认配置（对所有路由生效）
  defaultConfig:
    # 是否启用首字延迟 Histogram 统计（默认 true）
    enable_first_token_histogram: true
    # 是否启用排队监控（默认 true）
    enable_queue_metrics: true
    # 排队判断阈值（毫秒）：首字延迟超过此值的请求视为排队
    queue_threshold_ms: 500
    # 自定义 Histogram 分桶边界（毫秒），不配置则使用默认分桶
    # histogram_buckets:
    #   - 50
    #   - 100
    #   - 200
    #   - 300
    #   - 500
    #   - 800
    #   - 1000
    #   - 1500
    #   - 2000
    #   - 3000
    #   - 5000
    #   - 10000
    #   - 30000
    # 路径过滤：只对这些路径后缀的请求生效
    enable_path_suffixes:
      - "/v1/chat/completions"
      - "/v1/completions"
      - "/v1/messages"
      - "/generateContent"
  # 默认不禁用（全局生效）
  defaultConfigDisable: false
  phase: STATS
  priority: 200
  # 与 makefile 中 FULL_IMAGE 保持一致
  url: oci://harbor.qihoo.net/intelligent-egineering-hbox2/higress/plugins/custom/ai-metrics-advanced:v1.0.0
